<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 拼拼坐</title>
    <link rel="stylesheet" href="/static/_common/style.css">
    <link rel="stylesheet" href="../_common/tab-nav.css">
    <link rel="stylesheet" href="/static/_common/login-modal.css">
    <link rel="stylesheet" href="../_common/style.css">
    <link rel="stylesheet" href="_index/css/style.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content" id="mainContent">
            <div class="profile-container" id="profilePage">
                <div class="profile-header">
                    <div class="user-avatar-section">
                        <div class="avatar" id="userAvatar">
                            <span id="avatarText">U</span>
                        </div>
                        <button class="btn-edit" onclick="goToUserInfo()">
                            <span>✏️</span> 编辑
                        </button>
                    </div>
                    <div class="user-info">
                        <h2 class="user-name" id="userName">用户</h2>
                        <p class="user-phone" id="userPhone">未绑定手机号</p>
                    </div>
                </div>

                <div class="menu-section">
                    <div class="menu-item" onclick="goToCarManagement()">
                        <span class="menu-icon">🚗</span>
                        <span class="menu-text">车辆管理</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item" onclick="goToAddressManagement()">
                        <span class="menu-icon">📍</span>
                        <span class="menu-text">常用地址</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item" onclick="logout()">
                        <span class="menu-icon">🚪</span>
                        <span class="menu-text">退出登录</span>
                        <span class="menu-arrow">›</span>
                    </div>
                </div>
            </div>

            <div class="user-info-page hidden" id="userInfoPage">
                <div class="page-header">
                    <button class="btn-back" onclick="goBackToProfile()">
                        <span>‹</span>
                    </button>
                    <h1>个人信息</h1>
                    <div class="placeholder"></div>
                </div>

                <div class="user-info-content">
                    <div class="avatar-edit-section">
                        <div class="avatar" id="editAvatar">
                            <span id="editAvatarText">U</span>
                        </div>
                    </div>

                    <div class="info-list">
                        <div class="info-item">
                            <span class="info-label">账号</span>
                            <span class="info-value" id="infoAccount">-</span>
                        </div>
                        <div class="info-item editable" onclick="editField('name')">
                            <span class="info-label">昵称</span>
                            <span class="info-value" id="infoName">点击编辑</span>
                            <span class="info-arrow">›</span>
                        </div>
                        <div class="info-item editable" onclick="editField('phone')">
                            <span class="info-label">手机号</span>
                            <span class="info-value" id="infoPhone">未绑定</span>
                            <span class="info-arrow">›</span>
                        </div>
                        <div class="info-item editable" onclick="editField('email')">
                            <span class="info-label">邮箱</span>
                            <span class="info-value" id="infoEmail">未绑定</span>
                            <span class="info-arrow">›</span>
                        </div>
                    </div>

                    <button class="btn btn-secondary btn-block mt-20" onclick="openChangePasswordModal()">
                        修改密码
                    </button>
                </div>
            </div>
        </main>

        <nav class="tab-nav" id="tabNav"></nav>
    </div>

    <div class="modal" id="editFieldModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editFieldTitle">编辑</h3>
                <button class="modal-close" onclick="closeEditFieldModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editFieldForm" onsubmit="return submitEditField(event)">
                    <input type="hidden" id="editFieldName">
                    <div class="form-group">
                        <input type="text" id="editFieldValue" name="value" placeholder="请输入" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeEditFieldModal()">取消</button>
                        <button type="submit" class="btn btn-primary">确认</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="changePasswordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>修改密码</h3>
                <button class="modal-close" onclick="closeChangePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm" onsubmit="return submitChangePassword(event)">
                    <div class="form-group">
                        <label for="oldPassword">旧密码</label>
                        <input type="password" id="oldPassword" name="oldPassword" placeholder="请输入旧密码" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">新密码</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="请输入新密码" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">确认新密码</label>
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="请再次输入新密码" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeChangePasswordModal()">取消</button>
                        <button type="submit" class="btn btn-primary">确认修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="_index/js/main.js"></script>
</body>
</html>
