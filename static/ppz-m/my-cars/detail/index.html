<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆详情 - 拼拼坐</title>
    <link rel="stylesheet" href="/static/_common/style.css">
    <link rel="stylesheet" href="/static/_common/login-modal.css">
    <link rel="stylesheet" href="../../_common/style.css">
    <link rel="stylesheet" href="_index/css/style.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content" id="mainContent">
            <div class="detail-page" id="detailPage">
                <div class="page-header">
                    <button class="btn-back" onclick="goBackToCarManagement()">
                        <span>‹</span>
                    </button>
                    <h1>车辆详情</h1>
                    <div class="placeholder"></div>
                </div>

                <div class="detail-content">
                    <div class="detail-card" id="detailCard">
                        <div class="detail-image" id="detailImage">
                            <div class="detail-image-placeholder">🚗</div>
                        </div>
                        
                        <div class="detail-info" id="detailInfo">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <div class="image-modal-content" onclick="event.stopPropagation()">
            <button class="image-modal-close" onclick="closeImageModal()">&times;</button>
            <img id="modalImage" src="" alt="">
            <div class="image-modal-title" id="modalTitle"></div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="_index/js/main.js"></script>
</body>
</html>
