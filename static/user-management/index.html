<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理系统</title>
    <link rel="stylesheet" href="/static/_common/style.css">
    <link rel="stylesheet" href="/static/_common/login-modal.css">
    <link rel="stylesheet" href="_index/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>用户管理系统</h1>
        </header>

        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <div class="stat-label">总用户数</div>
                    <div class="stat-value" id="totalUsers">-</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👑</div>
                <div class="stat-info">
                    <div class="stat-label">管理员数</div>
                    <div class="stat-value" id="adminUsers">-</div>
                </div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header">
                <h2>用户列表</h2>
                <button class="btn btn-primary" onclick="refreshUserList()">
                    <span>🔄</span> 刷新
                </button>
            </div>
            <div class="table-container">
                <table class="data-table" id="userTable">
                    <thead>
                        <tr>
                            <th>UID</th>
                            <th>账号</th>
                            <th>姓名</th>
                            <th>邮箱</th>
                            <th>手机号</th>
                            <th>状态</th>
                            <th>管理员</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <div class="pagination-info">
                    共 <span id="totalCount">0</span> 条记录
                </div>
                <div class="pagination-controls">
                    <button class="page-btn" id="prevPage" onclick="prevPage()">
                        <span>‹</span>
                    </button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button class="page-btn" id="nextPage" onclick="nextPage()">
                        <span>›</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>修改密码</h3>
                <button class="modal-close" onclick="closePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="passwordForm" onsubmit="return submitPassword(event)">
                    <input type="hidden" id="passwordUid">
                    <div class="form-group">
                        <label for="newPassword">新密码</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="请输入新密码" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认密码</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
                        <button type="submit" class="btn btn-primary">确认修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="_index/js/main.js"></script>
</body>
</html>
