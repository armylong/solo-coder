<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D太阳系模型</title>
    <link rel="stylesheet" href="/static/_common/style.css">
    <link rel="stylesheet" href="_index/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="top-bar">
            <h1>🌞 3D太阳系模型</h1>
            <div class="controls">
                <button class="control-btn" id="pauseBtn">⏸️ 暂停</button>
                <button class="control-btn" id="resetBtn">🔄 重置</button>
            </div>
        </header>

        <main class="main-content">
            <div class="canvas-container" id="canvasContainer"></div>
        </main>

        <aside class="info-panel">
            <div class="planet-info" id="planetInfo">
                <h3>🪐 行星信息</h3>
                <p class="info-text">点击任意行星查看详细信息</p>
            </div>
            <div class="legend">
                <h3>📖 操作说明</h3>
                <ul>
                    <li>🖱️ 鼠标拖拽：旋转视角</li>
                    <li>🔄 滚轮：缩放画面</li>
                    <li>👆 点击行星：查看信息</li>
                </ul>
            </div>
        </aside>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="_index/js/main.js"></script>
</body>
</html>
